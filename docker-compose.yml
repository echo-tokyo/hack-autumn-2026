services:
  psql:
    image: postgres:alpine3.22
    container_name: keeper_psql
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - ./.env
    restart: always
    expose:
      - "5432"
    networks:
      main_network:
    volumes:
      - psql_data:/var/lib/postgresql/data/pgdata:rw
      - ./backend/db/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql:ro

  server:
    build:
      context: ./backend
      dockerfile: ./build/Dockerfile
    container_name: keeper_server
    restart: always
    expose:
      - "8000"
    env_file:
     - ./.env
    volumes:
      - ./backend/config.yml:/app/config.yml:ro
    networks:
      main_network:
    depends_on:
      - psql

  web-server:
    build:
      context: .
      dockerfile: ./web-server/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_MOCKS: "false"
    container_name: keeper_webserver
    restart: always
    ports:
      - "127.0.0.1:8804:80"
    networks:
      main_network:
    depends_on:
      - server

networks:
  main_network:
    driver: bridge

volumes:
  psql_data:
    name: keeper_psql_data
