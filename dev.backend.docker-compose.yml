services:
  psql:
    image: postgres:alpine3.22
    container_name: keeper_psql
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - ./.env
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      main_network:
    volumes:
      - psql_data:/var/lib/postgresql/data/pgdata:rw

networks:
  main_network:
    driver: bridge

volumes:
  psql_data:
    name: keeper_psql_data
