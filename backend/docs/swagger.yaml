basePath: /api/v1
consumes:
- application/json
definitions:
  entity.Currency:
    enum:
    - RUB
    - USD
    - EUR
    type: string
    x-enum-varnames:
    - CurrencyRUB
    - CurrencyUSD
    - CurrencyEUR
  entity.PaymentOccurrence:
    properties:
      amount:
        type: number
      createdAt:
        type: string
      currency:
        $ref: '#/definitions/entity.Currency'
      dueDate:
        type: string
      id:
        type: integer
      isNotified:
        type: boolean
      isOverdue:
        type: boolean
      isPaid:
        type: boolean
      notifiedAt:
        type: string
      paymentDate:
        type: string
      recurringPaymentId:
        type: integer
      updatedAt:
        type: string
    type: object
  entity.RecurringPayment:
    properties:
      amount:
        type: number
      billingDay:
        type: integer
      createdAt:
        type: string
      currency:
        $ref: '#/definitions/entity.Currency'
      id:
        type: integer
      isDeleted:
        type: boolean
      name:
        type: string
      startDate:
        type: string
      updatedAt:
        type: string
    type: object
  entity.User:
    properties:
      id:
        description: user id
        type: integer
      isAdmin:
        description: true if user is admin
        type: boolean
      username:
        description: user username
        type: string
    required:
    - id
    - isAdmin
    - username
    type: object
  v1.authBody:
    description: authBody represents a data for user auth (log in).
    properties:
      password:
        description: user password
        example: Qwerty123!
        maxLength: 40
        minLength: 8
        type: string
      username:
        description: user login
        example: user1
        maxLength: 50
        type: string
    required:
    - password
    - username
    type: object
  v1.recurringPaymentBody:
    description: recurringPaymentBody represents input for creating a recurring payment.
    properties:
      amount:
        description: payment amount; JSON may be string or number, decimal parses
          both
        example: 50000
        type: number
      billingDay:
        description: day of month when payment is due (1-31)
        example: 31
        maximum: 31
        minimum: 1
        type: integer
      currency:
        description: payment currency
        enum:
        - RUB
        - USD
        - EUR
        example: RUB
        type: string
      name:
        description: payment name
        example: Аренда офиса
        maxLength: 255
        type: string
      startDate:
        description: date of the first payment, YYYY-MM-DD
        example: "2026-10-31"
        type: string
    required:
    - amount
    - billingDay
    - currency
    - name
    - startDate
    type: object
  v1.updateBody:
    description: updateBody represents a data to update user and profile.
    properties:
      password:
        description: user password
        example: Qwerty123!
        maxLength: 40
        minLength: 8
        type: string
      username:
        description: user username
        example: user1
        maxLength: 50
        type: string
    type: object
  v1.updateOccurrenceBody:
    description: updateOccurrenceBody represents changes to apply to a payment occurrence.
    properties:
      is_paid:
        description: new payment status
        example: true
        type: boolean
      payment_date:
        description: actual payment date (YYYY-MM-DD)
        example: "2026-10-20"
        type: string
    type: object
  v1.userBody:
    description: userBody represents a data with user.
    properties:
      password:
        description: user password
        example: Qwerty123!
        maxLength: 40
        minLength: 8
        type: string
      username:
        description: user username
        example: user1
        maxLength: 50
        type: string
    required:
    - password
    - username
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: HTTP API Invoice Keeper (напоминания о регулярных платежах).
  title: Invoice Keeper API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Вход для существующего юзера по логину и паролю.
      operationId: auth-login
      parameters:
      - description: authBody
        in: body
        name: authBody
        required: true
        schema:
          $ref: '#/definitions/v1.authBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.User'
        "400":
          description: неверный логин или пароль
      summary: Вход для юзера.
      tags:
      - auth
  /auth/logout:
    post:
      description: Выход юзера (помещение refresh токена юзера в черный список).
      operationId: auth-logout
      responses:
        "204":
          description: No Content
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "403":
          description: токен в черном списке
      security:
      - JWTRefresh: []
      summary: Выход юзера.
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Получение всей информации о себе (юзер, профиль).
      operationId: auth-me-get
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.User'
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
      security:
      - JWTAccess: []
      summary: Получение информации о себе.
      tags:
      - auth
  /auth/obtain:
    post:
      description: Получение нового access токена по данному refresh токену из cookie.
      operationId: auth-obtain
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "403":
          description: токен в черном списке
      security:
      - JWTRefresh: []
      summary: Получение access токена.
      tags:
      - auth
  /payment-occurrences:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает периоды с фильтрами по родительскому платежу, валюте и статусу.
        Для каждого периода вычисляется is_overdue.
      operationId: payment-occurrences-list
      parameters:
      - description: фильтр по id регулярного платежа
        in: query
        name: recurring_payment_id
        type: integer
      - description: фильтр по валюте
        enum:
        - RUB
        - USD
        - EUR
        in: query
        name: currency
        type: string
      - description: фильтр по статусу
        enum:
        - paid
        - unpaid
        - overdue
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.PaymentOccurrence'
            type: array
        "400":
          description: неверные параметры фильтрации
        "401":
          description: неверный токен
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Список периодов регулярных платежей.
      tags:
      - payment-occurrences
  /payment-occurrences/{id}:
    get:
      consumes:
      - application/json
      description: Возвращает конкретный период по id. Для периода вычисляется is_overdue.
      operationId: payment-occurrences-get
      parameters:
      - description: id периода
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.PaymentOccurrence'
        "400":
          description: неверный id
        "401":
          description: неверный токен
        "404":
          description: период не найден
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Получить период регулярного платежа.
      tags:
      - payment-occurrences
    patch:
      consumes:
      - application/json
      description: |-
        Подтверждение/отмена оплаты и исправление фактической даты оплаты.
        Если is_paid=false — фактическая дата очищается.
        Если дата в будущем — ошибка 400.
      operationId: payment-occurrences-update
      parameters:
      - description: id периода
        in: path
        name: id
        required: true
        type: integer
      - description: изменения статуса и/или даты оплаты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.updateOccurrenceBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.PaymentOccurrence'
        "400":
          description: неверное тело запроса или значения
        "401":
          description: неверный токен
        "404":
          description: период не найден
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Обновить оплату периода.
      tags:
      - payment-occurrences
  /payments/summary:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает суммарные расходы по всем периодам, сгруппированные по валютам.
        Конвертация не выполняется: суммы в RUB, USD и EUR считаются отдельно.
      operationId: payments-summary
      produces:
      - application/json
      responses:
        "200":
          description: суммы по валютам, ключи RUB, USD, EUR
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: неверный токен
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Итоговые суммы по валютам.
      tags:
      - payments
  /recurring-payments:
    get:
      consumes:
      - application/json
      description: Возвращает все активные (не удалённые) регулярные платежи.
      operationId: recurring-payments-list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.RecurringPayment'
            type: array
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Список регулярных платежей.
      tags:
      - recurring-payments
    post:
      consumes:
      - application/json
      description: Создаёт регулярный платёж и первый период с датой StartDate.
      operationId: recurring-payments-create
      parameters:
      - description: данные нового регулярного платежа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.recurringPaymentBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.RecurringPayment'
        "400":
          description: неверное тело запроса или параметры
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "403":
          description: требуется роль администратора
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Создать регулярный платёж.
      tags:
      - recurring-payments
  /recurring-payments/{id}:
    delete:
      consumes:
      - application/json
      description: 'Мягко удаляет регулярный платёж: напоминания прекращаются, история
        сохраняется.'
      operationId: recurring-payments-delete
      parameters:
      - description: id регулярного платежа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: успешно удалён
        "400":
          description: неверный id
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "403":
          description: требуется роль администратора
        "404":
          description: регулярный платёж не найден
        "500":
          description: внутренняя ошибка
      security:
      - JWTAccess: []
      summary: Удалить регулярный платёж.
      tags:
      - recurring-payments
  /users:
    get:
      consumes:
      - application/json
      description: Получение списка юзеров со всеми данными.
      operationId: users-list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.User'
            type: array
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
      security:
      - JWTAccess: []
      summary: Получение списка юзеров. [Только админ]
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Создание нового юзера и профиля для него со всеми данными.
      operationId: users-create
      parameters:
      - description: userBody
        in: body
        name: userBody
        required: true
        schema:
          $ref: '#/definitions/v1.userBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.User'
        "400":
          description: слабый пароль
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "409":
          description: пользователь с введенным логином уже существует
      security:
      - JWTAccess: []
      summary: Создание нового юзера. [Только админ]
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Удаление юзера по его id.
      operationId: users-delete
      parameters:
      - description: ID юзера
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "404":
          description: пользователь не найден
      security:
      - JWTAccess: []
      summary: Удаление юзера по id. [Только админ]
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Получение юзера со всеми данными по его id.
      operationId: users-read
      parameters:
      - description: ID юзера
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.User'
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "404":
          description: пользователь не найден
      security:
      - JWTAccess: []
      summary: Получение юзера по id. [Только админ]
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Полное обновление профиля юзера, его группы (если студент) и пароля
        (опционально) по его id.
      operationId: users-update
      parameters:
      - description: ID юзера
        in: path
        name: id
        required: true
        type: integer
      - description: updateBody
        in: body
        name: updateBody
        required: true
        schema:
          $ref: '#/definitions/v1.updateBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.User'
        "400":
          description: слабый пароль
        "401":
          description: неверный токен (пустой, истекший или неверный формат)
        "404":
          description: пользователь не найден
      security:
      - JWTAccess: []
      summary: Обновление юзера по id. [Только админ]
      tags:
      - users
produces:
- application/json
schemes:
- http
securityDefinitions:
  JWTAccess:
    description: Access JWT-token. Cookie will automatic add after auth is done.
    in: cookie
    name: access
    type: apiKey
  JWTRefresh:
    description: Refresh JWT-token. Cookie will automatic add after auth is done.
    in: cookie
    name: refresh
    type: apiKey
swagger: "2.0"
